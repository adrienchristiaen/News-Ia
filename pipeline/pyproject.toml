[project]
name = "newsia"
version = "0.1.0"
description = "Veille IA hebdomadaire : collecte, tri, brouillon de script, alignement des sous-titres."
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]          # génération du brouillon via l'API
speech = ["faster-whisper>=1.0"]    # transcription (sous-titres mot à mot)
dev = ["pytest>=8"]

[project.scripts]
newsia = "newsia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newsia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
